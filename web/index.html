<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Calculator — Operations Console</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #111827;
            --border: #1f293d;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --text: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2rem;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }
        .header-title h1 { font-size: 1.6rem; font-weight: 700; color: #fff; }
        .header-title p { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem; }
        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 1.5rem;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        input, select, textarea {
            width: 100%;
            padding: 0.65rem 0.9rem;
            background: #0d1322;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
        }
        input:focus-visible, button:focus-visible { outline: 3px solid #fbbf24; outline-offset: 3px; }
        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.7rem 1.4rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .btn:hover { background: #2563eb; }
        .terminal {
            background: #060911;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            font-family: ui-monospace, monospace;
            font-size: 0.85rem;
            color: #10b981;
            height: 380px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .metrics-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .metric-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        .metric-val { font-size: 1.4rem; font-weight: 700; color: #fff; margin-top: 0.25rem; }
        .metric-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        input[type="checkbox"] { width: auto; margin-right: .5rem; }
        @media(max-width: 750px) { .grid { grid-template-columns: 1fr; } .metrics-bar { grid-template-columns: repeat(2, 1fr); } .header { flex-wrap: wrap; gap: 1rem; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">
            <h1>Map Calculator</h1>
            <p>Backend audit console · <a href='/' style='color:#a8cfff'>MAP calculator</a></p>
        </div>
        <div>
            <span class="badge">API console</span>
            <span class="badge" style="background: rgba(16,185,129,0.2); color: #10b981; border-color: #10b981;">Pattern-based identifier checks</span>
        </div>
    </div>

    <div class="metrics-bar">
        <div class="metric-box">
            <div class="metric-label">System Status</div>
            <div class="metric-val" style="color: var(--success);" id="m-status">—</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">Tasks Processed</div>
            <div class="metric-val" id="m-tasks">—</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">Audit Blocks Signed</div>
            <div class="metric-val" id="m-audit">—</div>
        </div>
        <div class="metric-box">
            <div class="metric-label">PHI Interceptions</div>
            <div class="metric-val" style="color: var(--accent);" id="m-phi">0</div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Backend task evaluation</h2>
            <div class="form-group"><label for="api_key">API key (not stored)</label><input type="password" id="api_key" autocomplete="off" placeholder="MAP_API_KEY"></div>
            <div class="form-group">
                <label for="task_id">Task / Sample ID</label>
                <input type="text" id="task_id" value="TASK-2026-LIVE-01">
            </div>
            <div class="form-group">
                <label for="target_id">Target Identifier</label>
                <input type="text" id="target_id" value="SPECIMEN-ALPHA-77">
            </div>
            <div class="form-group">
                <label for="primary_metric">Primary Measurement / Value</label>
                <input type="number" id="primary_metric" value="29.4" step="0.1">
            </div>
            <div class="form-group">
                <label for="secondary_metric">Secondary Metric / Kinetic Index</label>
                <input type="number" id="secondary_metric" value="14.8" step="0.1">
            </div>
            <div class="form-group">
                <label for="status_descriptor">Status / Phenotype Descriptor</label>
                <input type="text" id="status_descriptor" value="DISCORDANT_ANOMALY">
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="is_critical" checked> Trigger Emergency / Critical Flag</label>
            </div>
            <button class="btn" onclick="runAudit()">Execute Distributed Component Audit</button>
        </div>

        <div class="card">
            <h2>API response</h2>
            <div class="terminal" id="outputConsole" role="status" aria-live="polite">Enter the backend API key, then submit a task. No simulated results are shown.</div>
        </div>
    </div>

    <script>
    async function runAudit() {
      const el=document.getElementById('outputConsole');
      const apiKey=document.getElementById('api_key').value;
      if (!apiKey) {el.textContent='Enter an API key before sending a request.';return;}
      const number=(id)=>Number(document.getElementById(id).value);
      const payload={
        task_id:document.getElementById('task_id').value,
        target_identifier:document.getElementById('target_id').value,
        primary_metric:number('primary_metric'),
        secondary_metric:number('secondary_metric'),
        status_descriptor:document.getElementById('status_descriptor').value,
        is_critical_flag:document.getElementById('is_critical').checked
      };
      if (!Number.isFinite(payload.primary_metric)||!Number.isFinite(payload.secondary_metric)) {
        el.textContent='Both metrics must be finite numbers.';return;
      }
      el.textContent='Submitting request...';
      try {
        const res=await fetch('/api/audit',{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':apiKey},body:JSON.stringify(payload)});
        const data=await res.json();
        if(!res.ok){throw new Error('HTTP '+res.status+': '+JSON.stringify(data));}
        el.textContent=JSON.stringify(data,null,2);
        document.getElementById('m-status').textContent='CONNECTED';
        try {
          const metrics=await fetch('/metrics',{headers:{'X-API-Key':apiKey}});
          if(metrics.ok){
            const counts=await metrics.json();
            document.getElementById('m-tasks').textContent=counts.dossiers_processed_total;
            document.getElementById('m-audit').textContent=counts.audit_blocks_total;
          }
        } catch (_) { /* The successful audit response remains visible. */ }
      }catch(err){
        document.getElementById('m-status').textContent='UNAVAILABLE';
        el.textContent='Request failed: '+err.message+'. No results were generated.';
      }
    }
    </script>
</body>
</html>
